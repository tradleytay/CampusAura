<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Choose a new password for your CampusAura account.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2563eb">
  <title>Reset password — CampusAura</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="manifest" href="icons/site.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/rebuild.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="index.html">
      <img src="icons/icon.png" alt="CampusAura logo">
      <span>Campus<span class="brand-accent">Aura</span></span>
    </a>
    <section class="auth-card" aria-labelledby="resetTitle">
      <div class="auth-heading">
        <span class="events-preview-glow" aria-hidden="true">🔐</span>
        <h1 id="resetTitle">Choose a new password</h1>
        <p>Use at least 8 characters for your CampusAura account.</p>
      </div>
      <form id="resetPasswordForm" class="auth-form" hidden>
        <label class="auth-field">
          <span>New password</span>
          <span class="password-input-wrap">
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
            <button class="password-visibility-toggle" type="button" data-password-toggle aria-label="Show password" aria-controls="newPassword" aria-pressed="false">👁️</button>
          </span>
        </label>
        <label class="auth-field">
          <span>Confirm new password</span>
          <span class="password-input-wrap">
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
            <button class="password-visibility-toggle" type="button" data-password-toggle aria-label="Show password" aria-controls="confirmPassword" aria-pressed="false">👁️</button>
          </span>
        </label>
        <button id="resetSubmit" class="btn btn-primary btn-lg" type="submit">Update password</button>
      </form>
      <p id="resetStatus" class="auth-status" role="status" aria-live="polite">Checking your password reset link...</p>
      <a class="auth-toggle" href="auth.html">Back to sign in</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/password-visibility.js"></script>
  <script src="js/reset-password.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
